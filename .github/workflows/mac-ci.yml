name: mac-ci
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout private source
        env:
          SRC_TOKEN: ${{ secrets.ORDO_SRC_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${SRC_TOKEN}@github.com/TririLi/triri-ordo.git" src
          cd src && git log --oneline -1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Frontend deps + gate
        working-directory: src/windows
        run: |
          npm ci
          npm run typecheck
          npm run build
          npx vitest run

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/windows/src-tauri

      - name: cargo check (macOS)
        working-directory: src/windows
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build dmg (universal)
        working-directory: src/windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::notice::未配置 TAURI_SIGNING_PRIVATE_KEY，跳过 updater 签名，本次只产 dmg"
            npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg,app \
              --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg,app
          fi

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: ordo-dmg
          path: src/windows/src-tauri/target/**/release/bundle/dmg/*.dmg

      - name: Upload updater bundle + signature
        uses: actions/upload-artifact@v4
        with:
          name: ordo-updater
          if-no-files-found: warn
          path: |
            src/windows/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src/windows/src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
